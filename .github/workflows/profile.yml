name: Refresh profile graphics

on:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: profile-graphics
  cancel-in-progress: false

jobs:
  stats:
    name: GitHub Readme Stats
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch original GitHub Readme Stats cards
        id: fetch
        continue-on-error: true
        env:
          PROFILE_USERNAME: RahulAgarwal701
        run: python scripts/update_stats.py
      - name: Commit successfully refreshed cards
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add profile/stats.svg profile/languages.svg
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh public profile cards [skip ci]'
            git pull --rebase
            git push
          fi
      - name: Report provider failure
        if: steps.fetch.outcome == 'failure'
        run: |
          echo 'The public stats service was unavailable. Existing images were retained. Retry later.'
          exit 1

  calendar:
    name: Lowlighter isometric calendar
    needs: stats
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
    steps:
      - name: Generate contribution calendar
        if: env.METRICS_TOKEN != ''
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          user: RahulAgarwal701
          filename: profile/calendar.svg
          template: classic
          base: ''
          config_timezone: Asia/Kolkata
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
      - name: Explain first-time setup
        if: env.METRICS_TOKEN == ''
        run: echo 'Add a METRICS_TOKEN repository secret to enable the calendar. See SETUP.md.'
